<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Bautizo - Lisandro</title>
    <!-- Fuentes elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display&family=Playfair+Display+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: 'Playfair Display', serif;
            background-color: #FDFCF5; /* Fondo crema muy claro */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* --- CONTENEDOR PRINCIPAL CON FONDO DE ACUARELA --- */
        .card-container {
            width: 100%;
            max-width: 480px;
            background-color: #FFFFFF;
            padding: 50px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(169, 187, 155, 0.1);
            
            /* Imagen de fondo (ramas de acuarela) */
            background-image: url('ramas.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- ELEMENTOS DE DISEÑO --- */
        .content {
            position: relative;
            z-index: 3;
        }

        /* Cruz dorada (Imagen) */
        .cross-image {
            width: 90px;
            height: auto;
            margin-bottom: 10px;
        }

        /* Corazón pequeño dorado (Texto) */
        .gold-heart {
            color: #BF9B30;
            font-size: 1.3em;
            margin: 8px 0;
        }

        /* Recuadro de texto con ramas */
        .quote-box {
            border: 1px solid #EAE1CC;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 18px 15px;
            max-width: 320px;
            margin: 25px auto;
            border-radius: 8px;
            position: relative;
        }
        .quote-text {
            font-size: 0.95em;
            font-style: italic;
            color: #64705F;
            margin: 0;
        }
        .quote-text strong {
            font-weight: bold;
        }

        /* NOMBRE PRINCIPAL (Lisandro) */
        .main-name {
            font-family: 'Dancing Script', cursive;
            font-size: 5.5em;
            color: #43543D;
            margin: 15px 0;
            line-height: 1;
        }

        /* SECCIÓN DEL CENTRO CON RECUADRO SUAVE */
        .invitation-details-box {
            background-color: #FAFAF8;
            padding: 25px;
            border-radius: 12px;
            margin: 25px auto;
            border: 1px solid rgba(169, 187, 155, 0.25);
            max-width: 340px;
        }

        .title-bautizo {
            font-family: 'Playfair Display SC', serif;
            font-size: 1.8em;
            letter-spacing: 0.18em;
            color: #64705F;
            margin: 0 0 15px 0;
        }

        /* Texto de invitación */
        .invitation-text {
            font-size: 1.05em;
            margin: 18px 0;
            color: #64705F;
            line-height: 1.6;
        }

        /* BOTÓN PRINCIPAL "Ver invitación" */
        .main-button {
            display: inline-flex;
            align-items: center;
            background-color: #64705F;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1.05em;
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.12);
            margin-top: 18px;
            font-weight: bold;
        }
        .main-button:hover {
            background-color: #555E4E;
        }

        /* Separador de guirnalda y flor */
        .flower-separator {
            font-size: 1.6em;
            color: #BF9B30;
            margin: 25px 0;
        }

        /* --- SECCIÓN DE BOTONES DE ACCIÓN (INFERIOR) --- */
        .action-buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin: 35px auto 25px auto;
            max-width: 360px;
            padding-top: 25px;
            border-top: 1px solid #EAE1CC;
        }

        .action-button-item {
            text-decoration: none;
            color: #555E4E;
            font-size: 0.85em;
            text-align: center;
        }

        .action-icon-circle {
            background-color: rgba(250, 250, 248, 0.9);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 1px solid #D5CEBA;
            margin: 0 auto 8px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6em;
            position: relative;
        }

        /* Iconos (simulados) */
        .icon-church { font-size: 1.4em; }
        .icon-calendar { font-size: 1.4em; }
        .icon-location { font-size: 1.4em; }
        .icon-envelope { font-size: 1.4em; }

        /* Segunda fila de botones (Votación) */
        .second-row-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin: 20px auto 25px auto;
            max-width: 300px;
        }
        
    </style>
</head>
<body>

    <div class="card-container">
        <div class="content">
            <!-- Cruz dorada (Imagen) -->
            <img src="cruz.png" alt="Cruz Bautizo" class="cross-image">
            
            <!-- Corazón dorado -->
            <div class="gold-heart">❤</div>

            <!-- Recuadro con cita -->
            <div class="quote-box">
                <p class="quote-text">
                    Cada gran historia comienza con una <strong>bendición.</strong>
                </p>
            </div>

            <!-- Nombre (Lisandro) -->
            <h1 class="main-name">Lisandro</h1>

            <!-- Corazón dorado -->
            <div class="gold-heart">❤</div>

            <!-- Sección de invitación central -->
            <div class="invitation-details-box">
                <h2 class="title-bautizo">MI BAUTIZO</h2>

                <!-- Flor decorativa separator -->
                <div class="flower-separator">❀✿❀</div>

                <p class="invitation-text">
                    Un día lleno de amor, fe y bendiciones. Gracias por acompañarnos en este momento tan especial.
                </p>

                <!-- Botón central "Ver invitación" -->
                <a href="#" class="main-button">
                    <span style="margin-right:8px;">❤</span> Ver invitación
                </a>
            </div>

            <!-- SECCIÓN DE BOTONES INFERIORES -->
            <div class="action-buttons-grid">
                <!-- Información -->
                <a href="#" class="action-button-item">
                    <div class="action-icon-circle">
                        <span class="icon-church">⛪</span>
                    </div>
                    Información
                </a>
                
                <!-- Fecha y Hora -->
                <a href="#" class="action-button-item">
                    <div class="action-icon-circle">
                        <span class="icon-calendar">📅</span>
                    </div>
                    Fecha y Hora
                </a>
                
                <!-- Ubicación -->
                <a href="https://maps.app.goo.gl/TU_UBICACION" target="_blank" class="action-button-item">
                    <div class="action-icon-circle">
                        <span class="icon-location">📍</span>
                    </div>
                    Ubicación
                </a>
                
                <!-- Confirmación de Asistencia -->
                <a href="https://wa.me/TU_TELEFONO?text=Hola,%20confirmo%20mi%20asistencia%20al%20bautizo%20de%20Lisandro." target="_blank" class="action-button-item">
                    <div class="action-icon-circle">
                        <span class="icon-envelope">✉</span>
                    </div>
                    Confirmación
                </a>
            </div>

            <!-- Segunda fila de botones -->
            <div class="second-row-buttons">
                <!-- Comparte tus fotos -->
                <a href="#" class="action-button-item">
                    <div class="action-icon-circle">
                        <span class="icon-camera">📷</span>
                    </div>
                    Comparte fotos
                </a>
                
                <!-- Votación del Restaurante -->
                <a href="#" class="action-button-item">
                    <div class="action-icon-circle">
                        <span class="icon-restaurant">🍽</span>
                    </div>
                    Votación
                </a>
            </div>
            
            <!-- Corazón dorado final -->
            <div class="gold-heart">❤</div>

        </div>
    </div>

</body>
</html>
